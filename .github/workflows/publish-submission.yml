name: 发布访客投稿
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: submission-publish
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event.issue.pull_request == null &&
      ((github.event_name == 'issues' && github.event.action == 'opened' &&
        contains(github.event.issue.body, '### 文章标题') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
       (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == '已采纳') ||
       (github.event_name == 'issue_comment' && github.event.comment.body == '/发布'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 检查审批权限与正文版本
        id: approved
        uses: actions/github-script@v7
        with:
          script: |
            const permission = await github.rest.repos.getCollaboratorPermissionLevel({ ...context.repo, username: context.actor });
            if (!['admin', 'maintain', 'write'].includes(permission.data.permission)) throw new Error('发布者需要仓库写权限');
            const {data: issue} = await github.rest.issues.get({...context.repo, issue_number: context.issue.number});
            const snapshot = context.payload.issue;
            if (issue.body !== snapshot.body || issue.updated_at !== snapshot.updated_at) throw new Error('投稿已更新，请重新审核后发布');
            core.setOutput('body', issue.body);
            core.setOutput('updated', issue.updated_at);
            core.setOutput('login', issue.user.login);
      - run: npm ci
      - name: 生成文章
        id: gen
        env:
          ISSUE_BODY: ${{ steps.approved.outputs.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_LOGIN: ${{ steps.approved.outputs.login }}
        run: node .github/scripts/issue-to-post.mjs
      - name: 验证文章与站点
        run: npm run validate
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - name: 确认正文未在构建期间被修改
        uses: actions/github-script@v7
        env:
          APPROVED_BODY: ${{ steps.approved.outputs.body }}
          APPROVED_UPDATED: ${{ steps.approved.outputs.updated }}
        with:
          script: |
            const {data: issue} = await github.rest.issues.get({...context.repo, issue_number: context.issue.number});
            if (issue.body !== process.env.APPROVED_BODY || issue.updated_at !== process.env.APPROVED_UPDATED) throw new Error('构建期间投稿有更新，需重新审核');
      - name: 提交文章
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -e
          git config user.name "weegoto-bot"
          git config user.email "weegoto-bot@users.noreply.github.com"
          git add src/content/notes
          if ! git diff --cached --quiet; then
            git commit -m "feat(notes): publish submission #$ISSUE_NUMBER"
            git push origin main
          fi
      - name: 启动部署并回报构建中状态
        uses: actions/github-script@v7
        env:
          POST_SLUG: ${{ steps.gen.outputs.slug }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({...context.repo, workflow_id:'deploy.yml', ref:'main', inputs:{issue_number:String(context.issue.number),post_slug:process.env.POST_SLUG}});
            await github.rest.issues.createComment({...context.repo, issue_number:context.issue.number, body:'文章已提交，正在构建部署。完成后会另行报告上线结果；现在尚未确认上线。'});
      - name: 回报发布流程失败
        if: failure() && steps.approved.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({...context.repo, issue_number:context.issue.number, body:`发布流程失败，未确认上线。请检查 [运行日志](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})，修正后重新审核发布。`});
