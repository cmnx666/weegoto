# ===========================================================================
#  发布访客投稿：Issue  →  文章  →  网站
# ===========================================================================
#  两种触发方式（任选其一，效果完全一样）：
#
#   方式 A（推荐，零设置）  在 Issue 里发一条评论，内容以  /发布  开头
#   方式 B（需先建标签）    在 Issue 上打一个名为「已采纳」的标签
#
#    ⚠️ 方式 B 需要仓库里**先存在**这个标签。GitHub 不会自动创建它，
#       如果标签不存在，你就只能从已有标签里挑，名字对不上 → 任务被静默跳过。
#       建标签：仓库 → Issues → Labels → New label → 名称填「已采纳」
#       所以默认请用方式 A。
#
#  触发后依次做：
#    1. 解析 Issue 内容（并校验三项同意条款是否都勾了）
#    2. 生成 src/content/notes/<slug>.md
#    3. 提交并推送到 main
#    4. 主动触发 deploy.yml（见下方说明）
#    5. 回到 Issue 里回复结果
#
#  ⚠️ 为什么第 4 步必须显式触发？
#     用默认的 GITHUB_TOKEN 推送的提交，**不会**触发其它 on: push 工作流
#     （GitHub 防止无限循环的机制）。所以 deploy.yml 不会自己跑，
#     必须用 workflow_dispatch 显式叫醒它。
# ===========================================================================

name: 发布访客投稿

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  publish:
    # 只有项目组成员（作者/成员/协作者）的指令才生效，普通访客发 /发布 不会被采纳
    if: >-
      github.event.issue.pull_request == null &&
      (
        (github.event_name == 'issues' &&
         github.event.label.name == '已采纳') ||
        (github.event_name == 'issue_comment' &&
         startsWith(github.event.comment.body, '/发布') &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                  github.event.comment.author_association))
      )
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Issue 转成文章
        id: gen
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_LOGIN: ${{ github.event.issue.user.login }}
        run: node .github/scripts/issue-to-post.mjs

      - name: 提交并推送
        if: steps.gen.outcome == 'success'
        run: |
          set -e
          git config user.name  "weegoto-bot"
          git config user.email "weegoto-bot@users.noreply.github.com"
          git add src/content/notes
          if git diff --cached --quiet; then
            echo "内容没有变化，跳过提交"
            exit 0
          fi
          git commit -m "feat(notes): 发布访客投稿 #${{ github.event.issue.number }}"
          git push origin main

      - name: 触发站点重新部署
        if: steps.gen.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
            });
            core.info('已触发 deploy.yml');

      - name: 回帖：发布成功
        if: steps.gen.outcome == 'success'
        uses: actions/github-script@v7
        env:
          POST_SLUG: ${{ steps.gen.outputs.slug }}
          POST_TITLE: ${{ steps.gen.outputs.title }}
        with:
          script: |
            const slug = process.env.POST_SLUG;
            const title = process.env.POST_TITLE;
            const url = `https://weegoto.top/notes/${slug}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '🎉 **已采纳并发布**',
                '',
                `**${title}**`,
                '',
                `🔗 ${url}`,
                '',
                '部署大约需要 1 分钟，稍等片刻即可访问。',
                '',
                '感谢你的分享！如果之后想修改内容，直接编辑这条 Issue，然后重新发一次 `/发布` 即可（网址不变）。',
              ].join('\n'),
            });

      - name: 回帖：发布失败
        if: steps.gen.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '⚠️ **自动发布失败**',
                '',
                '最常见的原因：',
                '',
                '1. **三项同意条款没有全部勾选** —— 这是发布的必要条件',
                '2. 必填字段（文章标题 / 一句话摘要 / 正文）为空',
                '3. 链接短名与已有文章重名',
                '',
                '请检查后修正内容，然后重新发一次 `/发布`。',
                '',
                `详细报错见 [Actions 日志](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/publish-submission.yml)。`,
              ].join('\n'),
            });
